# =============================================================================
# GameCommunityCreator-MVP —— 一键部署（MySQL 8.4 + Spring Boot 后端 + nginx 前端）
#
# 使用（在 deploy/ 目录）：
#   cp .env.example .env      # 至少修改 MYSQL_ROOT_PASSWORD
#   docker compose up -d --build
#   open http://localhost:${FRONTEND_PORT:-80}
#
# 说明：
# - database/schema.sql + database/seed.sql 挂载到 MySQL 容器的
#   /docker-entrypoint-initdb.d/，只在「数据卷首次初始化」时按文件名顺序执行。
#   想重新初始化：docker compose down -v && docker compose up -d --build
# - 前端 nginx 把 /api/ 反代到 backend:8080，浏览器只访问 frontend 一个端口。
# - v4：MySQL / backend 调试端口只绑定 127.0.0.1；APP_BOOTSTRAP_* 首次启动创建初始开发者并认领旧项目；
#   认证为 Sa-Token 1.46.0 + JWT Simple（JWT 格式 token + 服务端登录态），JWT_SECRET 必须在生产环境
#   改成随机强密钥（>=32 字节）。
# - 生产必须在 nginx/网关终止 HTTPS，并通过 .env 覆盖 JWT_SECRET。
# - 本文件只用环境变量与默认值，校验命令：
#   docker compose --env-file .env.example config
# =============================================================================
name: game-community-creator

services:
  mysql:
    image: mysql:8.4
    container_name: gcc-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      # 默认值仅为「无 .env 也能通过 docker compose config 校验」；生产部署必须用 .env 覆盖
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-before-deploy}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gcc_mvp}
      TZ: Asia/Shanghai
    ports:
      # v3 安全：MySQL 只绑定宿主机回环地址，不暴露到局域网/公网（容器内仍通过 gcc-net 访问）
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      # $$ 让 compose 把 $ 留给容器内 shell，避免宿主机提前展开
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - gcc-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: game-community-creator-backend:latest
    container_name: gcc-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gcc_mvp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # v3：初始开发者账号（首次启动创建 + 认领 owner_user_id IS NULL 的旧项目；不配置则旧项目无主）
      APP_BOOTSTRAP_USERNAME: ${APP_BOOTSTRAP_USERNAME:-}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD:-}
      APP_BOOTSTRAP_DISPLAY_NAME: ${APP_BOOTSTRAP_DISPLAY_NAME:-独立开发者}
      # v4.1：Sa-Token JWT 插件签名密钥（HS256，>=32 字节；对应 sa-token.jwt-secret-key）；未配置时用仓库
      # 内置本地开发默认值，生产环境必须通过 .env 覆盖为随机强密钥（见 deploy/.env.example）
      JWT_SECRET: ${JWT_SECRET:-gcc-mvp-local-dev-only-jwt-secret-please-override-2026}
      # v4.1：登录态有效期（秒，默认 7200 = 2 小时；对应 sa-token.timeout，不自动续签）
      SA_TOKEN_TIMEOUT: ${SA_TOKEN_TIMEOUT:-7200}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # 调试用直连端口；浏览器正常走 nginx 反代。只绑定回环地址，避免绕过 nginx 暴露 API。
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - gcc-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: game-community-creator-frontend:latest
    container_name: gcc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - gcc-net

volumes:
  mysql-data:
    name: gcc-mysql-data

networks:
  gcc-net:
    name: gcc-net
    driver: bridge
