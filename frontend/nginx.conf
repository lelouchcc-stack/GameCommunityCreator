# =============================================================================
# GameCommunityCreator-MVP 生产前端站点配置（nginx:1.27-alpine）
#
# - SPA history fallback：/admin/projects/1/editor 这类前端路由刷新后仍能打开
# - /api/ 反代到 docker compose 网络里的 backend:8080（保留 /api 前缀）
# - 带 hash 的静态资源长缓存，index.html 不缓存
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 与前端页面体积匹配，够 API JSON 使用
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- API 反向代理 ----------
    # proxy_pass 不带 URI：/api/xxx 原样转发到 backend:8080/api/xxx
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---------- Vite 构建产物（文件名带 hash，可长缓存） ----------
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- SPA history fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发布后用户能拿到新入口
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
