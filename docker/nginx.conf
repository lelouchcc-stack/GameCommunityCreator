# 容器内 nginx：托管两个前端，并把 /api、/static 转给后端容器。
# 与 DEPLOY.md「手动路径 · 四」里的宿主机 nginx 配置等价，差别只有 upstream 用的是 compose 服务名。

upstream gcc_backend {
    server backend:9331;
    keepalive 16;
}

# ==================== 用户端：社区站点本身 ====================
# 必须挂在根路径：它的路由表来自后端下发的 ui_page.route_path，挂到子路径下会 404。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/site;
    index index.html;

    # 上传单文件上限 5MB（后端限制），这里留一点余量
    client_max_body_size 6m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端调 /api/xxx，后端认 /xxx —— proxy_pass 末尾的 / 负责剥掉 /api 前缀
    location /api/ {
        proxy_pass http://gcc_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_read_timeout 60s;
    }

    # 图片等上传文件由后端从 UPLOAD_DIR 提供，路径原样转发（proxy_pass 末尾不加 /）
    location /static/ {
        proxy_pass http://gcc_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite 产物是带内容哈希的文件名，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # history 路由回退：/guide、/post/1 这类地址刷新时必须回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ==================== 管理端：后台运营入口 ====================
# 单独一个端口，和用户端同一套反代规则。生产环境请换成 HTTPS + 限制来源 IP（见 DEPLOY.md 上线检查清单）。
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html/console;
    index index.html;

    client_max_body_size 6m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://gcc_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://gcc_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
