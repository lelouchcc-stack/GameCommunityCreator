spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ssy_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSl=false
    password: 123456
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 与 UploadService 的单文件上限保持一致，超过时由 GlobalExceptionHandler 转成友好提示
      max-file-size: 5MB
      max-request-size: 5MB
server:
  port: 9331
jwt:
  # 本地开发用的固定密钥，部署时请改用环境变量覆盖
  secret: 6f1c9d2a4b7e8f30a5c1d9e2b4f7081c3a6d5e9f2b8c0471a3e6d9f0b2c5a8d1e
  expiration: 86400000
app:
  upload:
    # 存储后端：local（本地磁盘，开发/答辩默认）| s3（任意 S3 兼容对象存储，部署方自选云厂商）
    provider: local
    local:
      # 本地存储根目录（相对后端运行目录），由 WebMvcConfig 映射到 /static/**
      dir: ./uploads
      public-base-url: /static
    s3:
      # 生产改 provider: s3 并填下面几项；账号密钥建议用环境变量覆盖，不要提交真实凭据
      endpoint: ""
      region: ""
      bucket: ""
      access-key: ""
      secret-key: ""
      # 对外访问基址（CDN / 自定义域名 / 桶公网地址）；留空则用 {endpoint}/{bucket} 兜底
      public-base-url: ""
      # MinIO 等自建网关通常需要 path-style（{endpoint}/{bucket}/{key}）
      path-style: false
