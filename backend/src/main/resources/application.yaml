# 应用配置
#
# 所有部署相关的值都可以用环境变量覆盖，语法 ${环境变量:默认值}——
# 默认值只服务于本地开发（本机 MySQL + 默认口令），生产部署请把带 ⚠ 的项用环境变量设上，
# 不要直接改这个文件（改了容易跟着代码一起提交上去）。
#
# 环境变量一览（详见 DEPLOY.md）：
#   DB_HOST=localhost  DB_PORT=3306  DB_NAME=ssy_db  DB_USERNAME=root  DB_PASSWORD=123456
#   DB_SSL_MODE=PREFERRED  SERVER_PORT=9331
#   JWT_SECRET=<必填>  JWT_EXPIRATION=86400000
#   UPLOAD_PROVIDER=local  UPLOAD_DIR=./uploads  UPLOAD_PUBLIC_BASE_URL=/static
#   S3_ENDPOINT / S3_REGION / S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY / S3_PUBLIC_BASE_URL / S3_PATH_STYLE

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ssy_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sslMode=${DB_SSL_MODE:PREFERRED}
    username: ${DB_USERNAME:root}
    # ⚠ 生产必改
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 与 UploadService 的单文件上限保持一致，超过时由 GlobalExceptionHandler 转成友好提示
      max-file-size: 5MB
      max-request-size: 5MB
server:
  port: ${SERVER_PORT:9331}
jwt:
  # ⚠ 生产必改（换成足够长的随机串，泄露等于任何人都能自己签后台令牌）。
  # 这里保留一个开发用固定值，只为让"clone 下来就能跑"成立。
  secret: ${JWT_SECRET:6f1c9d2a4b7e8f30a5c1d9e2b4f7081c3a6d5e9f2b8c0471a3e6d9f0b2c5a8d1e}
  # 令牌有效期（毫秒），默认 24 小时
  expiration: ${JWT_EXPIRATION:86400000}
app:
  upload:
    # 存储后端：local（本地磁盘，开发/答辩默认）| s3（任意 S3 兼容对象存储，部署方自选云厂商）
    provider: ${UPLOAD_PROVIDER:local}
    local:
      # 本地存储根目录（相对后端运行目录），由 WebMvcConfig 映射到 /static/**。
      # ⚠ 生产要指到一个持久化目录（容器里别放在容器层，否则重启即丢图）
      dir: ${UPLOAD_DIR:./uploads}
      # 对外访问基址（留空则图片地址就是 objectKey 本身）
      public-base-url: ${UPLOAD_PUBLIC_BASE_URL:/static}
    s3:
      # 生产改 provider=s3 并填下面几项；账号密钥建议用环境变量，不要提交真实凭据
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      # 对外访问基址（CDN / 自定义域名 / 桶公网地址）；留空则用 {endpoint}/{bucket} 兜底
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      # MinIO 等自建网关通常需要 path-style（{endpoint}/{bucket}/{key}）
      path-style: ${S3_PATH_STYLE:false}
