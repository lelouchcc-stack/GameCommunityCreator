server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: game-community-creator
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gcc_mvp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  servlet:
    multipart:
      # 图片上传大小限制
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

# Sa-Token 认证配置，token 用 JWT 格式，登录状态存在服务端
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  # token 有效期（秒），默认 2 小时
  timeout: ${SA_TOKEN_TIMEOUT:7200}
  # 最低活跃频率（秒），-1 表示不限制
  active-timeout: -1
  # 关闭自动续签
  auto-renew: false
  # 允许同一账号多端同时登录
  is-concurrent: true
  is-share: false
  # 只从请求头读取 token
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-write-header: false
  is-log: false
  is-print: false
  # JWT 签名密钥（HS256，至少 32 字节），生产环境用 JWT_SECRET 覆盖
  jwt-secret-key: ${JWT_SECRET:gcc-mvp-local-dev-only-jwt-secret-please-override-2026}

app:
  cors:
    # 本地开发允许的前端地址
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:3000}
  page-config:
    max-json-bytes: 204800
  upload:
    # 图片上传保存目录
    dir: ${UPLOAD_DIR:./data/uploads}
  bootstrap:
    # 初始开发者账号，用户名和密码从环境变量读
    username: ${APP_BOOTSTRAP_USERNAME:}
    password: ${APP_BOOTSTRAP_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_DISPLAY_NAME:独立开发者}

logging:
  level:
    root: INFO
    com.gcc.community: INFO
